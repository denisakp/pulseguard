name: Release

# Fires when a version tag is pushed (e.g. v1.0.0-beta, v1.0.0).
# Builds a multi-arch image, publishes it to GHCR, and cuts a GitHub Release
# from the matching release-notes/<tag>.md file.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to GHCR

env:
  IMAGE_NAME: ogoune
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: setup variables
        id: vars
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_repo=${{ env.REGISTRY }}/$OWNER_LOWER/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          # A tag containing a hyphen is a prerelease (v1.0.0-beta, v1.2.0-rc.1).
          # Prereleases never move the `latest` tag and are flagged on the Release.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: verify release notes exist
        run: |
          set -euo pipefail
          NOTES="release-notes/${{ steps.vars.outputs.version }}.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "::error::Missing $NOTES — add the release notes before tagging ${{ steps.vars.outputs.version }}."
            exit 1
          fi

      - name: compute image tags
        id: tags
        run: |
          set -euo pipefail
          REPO="${{ steps.vars.outputs.image_repo }}"
          VERSION="${{ steps.vars.outputs.version }}"
          TAGS="${REPO}:${VERSION}"
          # Agent image lives in the same registry/owner, suffixed -agent (spec 082).
          AGENT_REPO="${REPO}-agent"
          AGENT_TAGS="${AGENT_REPO}:${VERSION}"
          if [[ "${{ steps.vars.outputs.prerelease }}" == "false" ]]; then
            TAGS="${TAGS},${REPO}:latest"
            AGENT_TAGS="${AGENT_TAGS},${AGENT_REPO}:latest"
          fi
          echo "list=$TAGS" >> "$GITHUB_OUTPUT"
          echo "agent_list=$AGENT_TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}
          tags: ${{ steps.tags.outputs.list }}

      # Agent image (spec 082) — same commit/tag as the API image → lockstep version.
      - name: build and push agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-agent
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-agent
          tags: ${{ steps.tags.outputs.agent_list }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Release binaries (spec 082) — static linux amd64 + arm64 + checksums.
      - name: build agent release binaries
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -ldflags "-w -s -X main.version=${VERSION}" \
              -o "dist/ogoune-agent-linux-${arch}" ./cmd/agent
          done
          ( cd dist && sha256sum ogoune-agent-linux-amd64 ogoune-agent-linux-arm64 > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.vars.outputs.version }}
          body_path: release-notes/${{ steps.vars.outputs.version }}.md
          prerelease: ${{ steps.vars.outputs.prerelease }}
          generate_release_notes: false
          files: |
            dist/ogoune-agent-linux-amd64
            dist/ogoune-agent-linux-arm64
            dist/SHA256SUMS
