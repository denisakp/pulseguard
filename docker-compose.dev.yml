name: ogoune

volumes:
  ogoune-data:
  # Shared between agent-init (writer) and agent (reader). Holds the dev host's
  # credential — never committed, lives only in this volume.
  agent-cfg:

services:
  ogoune:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9596}:9596"
    environment:
      AUTH_EMAIL: ${AUTH_EMAIL:-admin@ogoune.test}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD is required}
      # Database — defaults to embedded SQLite, override to postgres for full stack
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      SQLITE_PATH: /data/ogoune.db
      DATABASE_URL: ${DATABASE_URL:-}
      DB_LOG_LEVEL: debug
      # Scheduler — defaults to in-process TimingWheel, override to asynq for full stack
      SCHEDULER_MODE: ${SCHEDULER_MODE:-timingwheel}
      SCHEDULER_MAX_WORKERS: ${SCHEDULER_MAX_WORKERS:-10}
      SCHEDULER_TICK_INTERVAL: ${SCHEDULER_TICK_INTERVAL:-1s}
      SCHEDULER_SHUTDOWN_TIMEOUT: ${SCHEDULER_SHUTDOWN_TIMEOUT:-30s}
      REDIS_URL: ${REDIS_URL:-}
      # Security — required, generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      # Enterprise Edition — leave empty for Community Edition
      ENTERPRISE_LICENSE_KEY: ${ENTERPRISE_LICENSE_KEY:-}
      STATIC_DIR: /app/static
    volumes:
      - ogoune-data:/data

  # Zero-touch dogfood (spec 082): after the API is up, register a "local" host
  # and write its credential to the shared volume as /shared/agent.cfg.
  # Idempotent — skips if the cfg already exists. The credential never leaves the
  # volume (not in the repo, not in the image).
  agent-init:
    image: alpine:3.20
    restart: "no"
    depends_on:
      - ogoune
    environment:
      AUTH_EMAIL: ${AUTH_EMAIL:-admin@ogoune.test}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD is required}
    volumes:
      - agent-cfg:/shared
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        apk add --no-cache curl jq >/dev/null
        if [ -f /shared/agent.cfg ]; then
          echo "agent-init: /shared/agent.cfg already present — nothing to do"
          exit 0
        fi
        echo "agent-init: waiting for API health…"
        until curl -fsS http://ogoune:9596/api/health >/dev/null 2>&1; do sleep 2; done
        echo "agent-init: logging in as $$AUTH_EMAIL"
        TOKEN=$$(curl -fsS -X POST http://ogoune:9596/api/auth/login \
          -H 'Content-Type: application/json' \
          -d "{\"email\":\"$$AUTH_EMAIL\",\"password\":\"$$AUTH_PASSWORD\"}" | jq -r .token)
        if [ -z "$$TOKEN" ] || [ "$$TOKEN" = null ]; then echo "agent-init: login failed"; exit 1; fi
        echo "agent-init: registering host 'local'"
        CRED=$$(curl -fsS -X POST http://ogoune:9596/api/v1/hosts \
          -H "Authorization: Bearer $$TOKEN" -H 'Content-Type: application/json' \
          -d '{"name":"local"}' | jq -r .data.credential)
        if [ -z "$$CRED" ] || [ "$$CRED" = null ]; then echo "agent-init: host registration failed"; exit 1; fi
        printf 'OGOUNE_BACKEND_URL=ws://ogoune:9596/api/v1/agent/stream\nOGOUNE_CREDENTIAL=%s\nOGOUNE_LOG_LEVEL=info\n' "$$CRED" > /shared/agent.cfg
        echo "agent-init: wrote /shared/agent.cfg — host 'local' provisioned"

  # The agent reads the shared cfg at its default path (/etc/ogoune/agent.cfg) and
  # streams this machine's metrics. pid:host lets it read the host's real metrics.
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    restart: unless-stopped
    pid: host
    depends_on:
      agent-init:
        condition: service_completed_successfully
    volumes:
      - agent-cfg:/etc/ogoune:ro