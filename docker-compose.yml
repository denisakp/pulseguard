# Ogoune — configurable via environment variables
#
# Default (zero dependencies — SQLite + in-process scheduler):
#   cp .env.example .env   # set JWT_SECRET and APP_SECRET_KEY
#   docker compose up -d
#
# Full stack (PostgreSQL + Redis + Asynq):
#   Add COMPOSE_PROFILES=full to your .env, then:
#   docker compose up -d
#
# Enterprise Edition: add ENTERPRISE_LICENSE_KEY to your .env.

name: ogoune
volumes:
  ogoune-data:
  postgres-data:
services:
  postgres:
    profiles: [full]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ogoune}
      POSTGRES_USER: ${POSTGRES_USER:-ogoune}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ogoune}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ogoune}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    profiles: [full]
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  ogoune:
    image: ghcr.io/denisakp/ogoune:8f79287
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9596}:9596"
    environment:
      # Database — defaults to embedded SQLite, override to postgres for full stack
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      SQLITE_PATH: /data/ogoune.db
      DATABASE_URL: ${DATABASE_URL:-}
      DB_LOG_LEVEL: error
      # Scheduler — defaults to in-process TimingWheel, override to asynq for full stack
      SCHEDULER_MODE: ${SCHEDULER_MODE:-timingwheel}
      SCHEDULER_MAX_WORKERS: ${SCHEDULER_MAX_WORKERS:-10}
      SCHEDULER_TICK_INTERVAL: ${SCHEDULER_TICK_INTERVAL:-1s}
      SCHEDULER_SHUTDOWN_TIMEOUT: ${SCHEDULER_SHUTDOWN_TIMEOUT:-30s}
      REDIS_URL: ${REDIS_URL:-}
      # Security — required, generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      # Enterprise Edition — leave empty for Community Edition
      ENTERPRISE_LICENSE_KEY: ${ENTERPRISE_LICENSE_KEY:-}
      STATIC_DIR: /app/static
    volumes:
      - ogoune-data:/data

  # Host monitoring agent (spec 082) — OPT-IN. A plain `docker compose up` does
  # NOT start it; it needs a per-host credential, so it would crash-loop without
  # one. Register a host (Hosts → Register host) to get an ag_live_ credential,
  # then:
  #   OGOUNE_BACKEND_URL=wss://your-ogoune/api/v1/agent/stream \
  #   OGOUNE_CREDENTIAL=ag_live_… docker compose --profile agent up -d
  # No credential is committed here — both come from the operator's environment.
  agent:
    profiles: [agent]
    image: ghcr.io/denisakp/ogoune-agent:latest
    restart: unless-stopped
    pid: host
    environment:
      # NB: plain refs (not ${VAR:?…}) — a required-var check here would abort even
      # a plain `up` (compose interpolates every service before profile selection).
      # Supply both when opting in; the agent fails fast with a clear message if
      # they're missing.
      OGOUNE_BACKEND_URL: ${OGOUNE_BACKEND_URL:-}
      OGOUNE_CREDENTIAL: ${OGOUNE_CREDENTIAL:-}
      OGOUNE_INTERVAL: ${OGOUNE_INTERVAL:-10s}
      OGOUNE_LOG_LEVEL: ${OGOUNE_LOG_LEVEL:-info}
